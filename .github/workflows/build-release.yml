name: build-stable-submission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install document build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-dejavu-core zip
      - name: Verify mathematics and computational artifacts
        run: |
          python run_all.py
          python -m pytest -q | tee pytest.txt
      - name: Build canonical PDF and DOCX
        run: |
          mkdir -p dist
          pandoc paper/UCD_YM_Jaffe_Witten_Submission.md -o dist/UCD_YM_Jaffe_Witten_Submission.docx --from markdown+tex_math_dollars --standalone
          pandoc paper/UCD_YM_Jaffe_Witten_Submission.md -o dist/UCD_YM_Jaffe_Witten_Submission.pdf --from markdown+tex_math_dollars --pdf-engine=xelatex --standalone -V mainfont='DejaVu Serif' -V sansfont='DejaVu Sans' -V monofont='DejaVu Sans Mono'
      - name: Build stable verification archive
        run: |
          find . -type f ! -path './.git/*' ! -path './.pytest_cache/*' ! -path '*/__pycache__/*' ! -path './dist/*' -print0 | sort -z | xargs -0 sha256sum > dist/MANIFEST.sha256
          zip -qr dist/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE.zip . -x '.git/*' '.pytest_cache/*' '*/__pycache__/*' 'dist/*'
          sha256sum dist/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE.zip > dist/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UCD-Yang-Mills-Jaffe-Witten-submission
          path: dist/
