name: finalize-stable-upload

on:
  push:
    paths:
      - '.github/workflows/finalize-upload.yml'
      - 'paper/UCD_YM_Jaffe_Witten_Submission.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install document build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-dejavu-core zip
      - name: Run canonical verification suite
        run: |
          python run_all.py
          python -m pytest -q | tee results/final_pytest.txt
          python src/independent_verifier_v6.py
          python src/final_verifier_v6.py
      - name: Build canonical manuscript binaries
        run: |
          pandoc paper/UCD_YM_Jaffe_Witten_Submission.md -o paper/UCD_YM_Jaffe_Witten_Submission.docx --from markdown+tex_math_dollars --standalone
          pandoc paper/UCD_YM_Jaffe_Witten_Submission.md -o paper/UCD_YM_Jaffe_Witten_Submission.pdf --from markdown+tex_math_dollars --pdf-engine=xelatex --standalone -V mainfont='DejaVu Serif' -V sansfont='DejaVu Sans' -V monofont='DejaVu Sans Mono'
      - name: Build checksum manifest and stable archive
        run: |
          find . -type f ! -path './.git/*' ! -path './.pytest_cache/*' ! -path '*/__pycache__/*' ! -path './release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip' ! -path './release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          rm -f release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_SHA256.txt
          zip -qr release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip . -x '.git/*' '.pytest_cache/*' '*/__pycache__/*' 'release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip'
          sha256sum release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip > release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_SHA256.txt
      - name: Commit finished deliverables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/UCD_YM_Jaffe_Witten_Submission.pdf paper/UCD_YM_Jaffe_Witten_Submission.docx MANIFEST.sha256 results/ release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_PACKAGE.zip release/UCD_YM_JAFFE_WITTEN_SUBMISSION_COMPLETE_SHA256.txt
          git commit -m 'Finalize stable submission upload' || exit 0
          git push
